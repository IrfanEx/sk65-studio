name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $app = python -c "import sk65_studio as s; print(s.APP_VERSION)"
          if ("v$app" -ne "$env:GITHUB_REF_NAME") { throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $app" }

      - name: Run tests
        run: |
          python test_layers.py
          python test_lighting.py
          python test_tray.py
          python test_knob.py
          python test_macros.py
          python test_custom.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --icon "assets\via.ico" --add-data "assets\via.ico;assets" --hidden-import pystray._win32 --name "Womier_SK65_Studio" sk65_studio.py

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if ("$env:GITHUB_REF_NAME" -match '^v(\d+\.\d+\.\d+)$') { & $iscc.FullName "/DAppVersion=$($Matches[1])" installer.iss }
          else { & $iscc.FullName installer.iss }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/Womier_SK65_Studio_Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-FileHash dist\Womier_SK65_Studio_Setup.exe -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          For the Womier SK65 V1 (USB 0603:0351) on Windows 10 or 11, 64-bit.

          Download **Womier_SK65_Studio_Setup.exe** and run it once. It installs the app with Start menu and desktop shortcuts, and it appears in Control Panel. The installer is not code signed, so Windows may show a SmartScreen warning: choose More info, then Run anyway. Installing asks for administrator rights once; the app itself runs without them.

          Built by GitHub Actions from this tag.

          SHA-256 of Womier_SK65_Studio_Setup.exe: ``$setup``
          "@
          gh release create $env:GITHUB_REF_NAME dist\Womier_SK65_Studio_Setup.exe --title "SK65 Studio $env:GITHUB_REF_NAME" --notes ($notes -replace '(?m)^ +', '')
